<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Architecture | Nikhil Repale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/professional-upgrade.css">
  <link rel="stylesheet" href="./assets/css/architectures.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-main);
      padding: 2rem;
    }
    .upload-page-container {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 3rem;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .upload-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }
    .upload-page-header h2 {
      margin: 0;
      color: var(--theme-primary);
    }
    .back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .back-btn:hover {
      color: var(--theme-primary);
    }
  </style>
</head>
<body class="dark-theme">
  <!-- 3D Global Background -->
  <canvas id="devops-3d-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events: none;"></canvas>

  
  <div class="upload-page-container">
    <div class="upload-page-header">
      <h2><i class="fas fa-sitemap"></i> Upload Architecture</h2>
      <a href="index.html#projects" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
    </div>

    <form id="arch-upload-form" class="arch-upload-form">
      <p class="arch-upload-warning"><i class="fas fa-info-circle"></i> Architectures uploaded here are saved locally in your browser cache.</p>
      <div class="arch-form-group">
        <label for="arch-title">Architecture Title</label>
        <input type="text" id="arch-title" placeholder="e.g., AWS 3-Tier Web App" required>
      </div>
      <div class="arch-form-group">
        <label for="arch-desc">Description & Explanation</label>
        <textarea id="arch-desc" rows="4" placeholder="Explain the architecture flow in detail..." required></textarea>
      </div>
      <div class="arch-form-group">
        <label for="arch-file" class="arch-file-label">
          <i class="fas fa-cloud-upload-alt"></i> Choose Image File
        </label>
        <input type="file" id="arch-file" accept="image/*" required>
        <span id="arch-file-name" class="arch-file-name">No file chosen</span>
      </div>
      <button type="submit" class="btn" style="margin-top: 1.5rem; width: 100%; justify-content: center;">
        Upload & Return to Gallery <i class="fas fa-arrow-right"></i>
      </button>
    </form>
  </div>

  <script src="./assets/js/architecture-upload.js"></script>

  <!-- Three.js Global Background -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./assets/js/devops-3d-bg.js"></script>
</body>
</html>
